<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Moje drogi">
<meta name="theme-color" content="#1d5c45">
<title>Moje drogi</title>
<link id="appleIcon" rel="apple-touch-icon">
<link id="manifestLink" rel="manifest">
<style>
:root{
  --green:#1d5c45;--green-2:#2f7a5d;--green-l:#e6f2ec;--bg:#f4f5f3;--card:#fff;--text:#1b1f1d;--muted:#7a817d;
  --line:#eceeec;--orange:#f08a24;--red:#e5484d;--radius:16px;
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:15px;overscroll-behavior:none}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
html{background:#e9ebe9}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.page{padding:calc(var(--st) + 12px) 16px 0}
h1{font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:14px}
h2{font-size:16px;font-weight:700;margin-bottom:12px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.muted{color:var(--muted);font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* tab bar */
#tabbar{display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(var(--sb) + 6px)}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#8b928e;padding:4px 0}
#tabbar button.on{color:var(--green);font-weight:600}
#tabbar svg{width:23px;height:23px}

/* hero */
.hero{position:relative;min-height:calc(190px + var(--st));padding:calc(var(--st) + 14px) 20px 52px;color:#fff;
  background:
   radial-gradient(circle at 12% 18%,#f5c400 0 5px,transparent 6px),radial-gradient(circle at 30% 40%,#e5484d 0 6px,transparent 7px),
   radial-gradient(circle at 72% 22%,#1e88e5 0 5px,transparent 6px),radial-gradient(circle at 85% 55%,#22a06b 0 7px,transparent 8px),
   radial-gradient(circle at 55% 65%,#8e4ec6 0 5px,transparent 6px),radial-gradient(circle at 20% 75%,#f08a24 0 6px,transparent 7px),
   radial-gradient(circle at 45% 12%,#f0587a 0 4px,transparent 5px),radial-gradient(circle at 92% 85%,#f5c400 0 5px,transparent 6px),
   linear-gradient(160deg,#5b5f63,#2c2f31 60%,#1a1c1d)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.1) 50%,rgba(0,0,0,.45))}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:26px;line-height:1.15;margin:18px 0 0;display:block}
.hero .top{display:flex;justify-content:flex-end}
.hero .top button{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;backdrop-filter:blur(8px)}
.overlap{margin-top:-32px;position:relative;z-index:2;padding:0 16px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stats3 b{display:block;font-size:26px;font-weight:700}
.stats3>div+div{border-left:1px solid var(--line)}
.act{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:13px}
.act:first-of-type{border-top:0}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);background:transparent}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:25px;font-weight:600;font-size:16px}
.btn-primary{background:var(--green);color:#fff}
.btn-outline{border:1.5px solid #cfd5d2;background:#fff}
.btn-danger{width:50px;flex-shrink:0;border:1.5px solid #f5c6c7;color:var(--red);background:#fff}

/* segmented */
.seg{display:flex;background:#eceeec;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px 2px;border-radius:10px;font-size:12px;color:#555}
.seg button.on{background:#fff;color:var(--green);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pills{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
.pills button{padding:8px 14px;border-radius:20px;font-size:13px;white-space:nowrap;color:#444}
.pills button.on{background:var(--green);color:#fff;font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:14px}
.mgrid button{padding:6px 0;border-radius:8px;font-size:11px;background:#fff;color:#444;white-space:nowrap}
.mgrid button.on{background:var(--green);color:#fff;font-weight:600}
.mgrid button:first-child{grid-column:span 2}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:14px;color:var(--muted)}
.search input{border:0;outline:0;flex:1;background:none;color:var(--text);font-size:16px}

/* list */
.group{padding:0;overflow:hidden}
.group-h{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:700;font-size:14px;border-bottom:1px solid var(--line)}
.group-h .ic{width:20px;height:20px;border-radius:6px;background:var(--green);color:#fff;display:grid;place-items:center}
.group-h .ic svg{width:12px;height:12px}
.group-h .chev svg{width:16px;height:16px;color:var(--muted);display:block}
.rt{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;width:100%;text-align:left;cursor:pointer}
.rt:first-of-type{border-top:0}
.rt .sub{color:var(--muted);font-size:12px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rt .side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.acts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.mini{font-size:12px;padding:5px 10px;border-radius:14px;border:1px solid #dfe3e1;background:#fff;display:inline-flex;align-items:center;gap:4px}
.mini svg{width:12px;height:12px}
.mini-p{background:var(--green);color:#fff;border-color:var(--green)}
.tag{font-size:11px;padding:2px 7px;border-radius:8px;background:#eef0ef;color:#555}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.stats4 b{display:block;font-size:24px;font-weight:700}
.stats4>div+div{border-left:1px solid var(--line)}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.visit{padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.visit:first-of-type{border-top:0}
.hist{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.hist:first-of-type{border-top:0}
.grade{display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 5px;border-radius:7px;background:#eef0ef;color:#333;font-weight:700;font-size:12px}
.link{color:var(--green);font-weight:600;cursor:pointer}
.st{display:flex;align-items:center;gap:4px;font-size:12px;justify-content:flex-end}
.st svg{width:14px;height:14px}
.st-top{color:var(--green-2)}.st-flash{color:var(--orange)}.st-zona{color:#3e63dd}.st-nope{color:var(--red)}.st-test{color:#555}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

/* form / sheet */
.sheet{position:fixed;inset:0;max-width:480px;margin:0 auto;background:var(--bg);z-index:50;display:flex;flex-direction:column;animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.slide{animation:slide .22s ease}
@keyframes slide{from{transform:translateX(30%);opacity:.4}to{transform:none;opacity:1}}
.sheet-body{flex:1;overflow-y:auto;padding:calc(var(--st) + 10px) 16px 20px}
.sheet-foot{padding:10px 16px calc(var(--sb) + 10px);background:var(--bg)}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.lbl{display:block;font-size:13px;font-weight:600;margin:16px 0 8px}
.field{display:flex;align-items:center;gap:8px;width:100%;background:#fff;border:1px solid #dfe3e1;border-radius:12px;padding:0 12px;height:46px}
.field input,.field select{flex:1;border:0;outline:0;background:none;height:100%;font-size:16px;-webkit-appearance:none;appearance:none;min-width:0}
textarea.field{height:80px;padding:12px;resize:none;outline:0;font-size:16px;display:block}
.photo-main{height:150px;border-radius:14px;overflow:hidden;position:relative;background:linear-gradient(160deg,#6b6f73,#2c2f31);display:grid;place-items:center;color:#fff}
.photo-main img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.photo-main label{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,.45);display:grid;place-items:center;cursor:pointer}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.thumb{position:relative;width:60px;height:60px;border-radius:10px;overflow:hidden;flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.thumb button svg{width:12px;height:12px}
.colors{display:flex;gap:12px;flex-wrap:wrap}
.colors button{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.colors button.on{outline:2.5px solid var(--green);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex-shrink:0;min-width:40px;padding:9px 10px;border-radius:10px;background:#fff;border:1px solid #dfe3e1;font-size:13px}
.chips button.on{background:var(--green);color:#fff;border-color:var(--green);font-weight:600}
.chips.grades button{flex:1;min-width:0;padding:10px 0;font-weight:600}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;background:#fff;border:1px solid #dfe3e1;display:grid;place-items:center}
.stepper span{width:50px;text-align:center;font-weight:600;font-size:16px}

/* detail */
.dhero{height:calc(320px + var(--st));position:relative;background:linear-gradient(160deg,#6b6f73,#2c2f31)}
.dhero img{width:100%;height:100%;object-fit:cover}
.dhero .iconbtn{position:absolute;top:calc(var(--st) + 10px);background:rgba(0,0,0,.4);color:#fff}
.dcard{background:#fff;border-radius:22px 22px 0 0;margin-top:-24px;position:relative;padding:20px 16px;min-height:50vh}
.bigGrade{width:52px;height:52px;border-radius:14px;color:#fff;font-weight:800;font-size:18px;display:grid;place-items:center}
.badge{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:16px;font-size:13px;font-weight:600}
.badge svg{width:14px;height:14px}
.meta{display:flex;align-items:center;gap:14px;margin:18px 0;font-size:13px;flex-wrap:wrap}
.meta>span+span{border-left:1px solid var(--line);padding-left:14px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.viewer{position:fixed;inset:0;background:#000;z-index:80;display:grid;place-items:center}
.viewer img{max-width:100%;max-height:100%}

/* stats */
.kpi{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px}
.kpi2{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.kpi svg{width:26px;height:26px;margin-bottom:6px}
.kpi b{display:block;font-size:22px}
.kc{grid-template-columns:repeat(5,1fr);gap:2px;align-items:start}
.kc6{grid-template-columns:repeat(6,1fr)}
.kc4{grid-template-columns:repeat(4,1fr)}
.kc3{grid-template-columns:repeat(3,1fr)}
.kc>div{padding:6px 0;border-radius:10px}
.kc svg{width:18px;height:18px;margin-bottom:2px}
.kc b{font-size:18px;line-height:1.2}
.kc .muted{font-size:11px;display:block;line-height:1.2}
.kc .sum{background:var(--green-l)}
.wrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.wrow:first-of-type{border-top:0}
.rank{width:24px;height:24px;border-radius:50%;background:var(--green-l);color:var(--green);font-weight:700;font-size:12px;display:grid;place-items:center;flex-shrink:0}
.rank.r1{background:var(--green);color:#fff}
.wrow .track{height:6px;background:#eef0ef;border-radius:3px;overflow:hidden;margin:6px 0 5px}
.wrow .fill{height:100%;background:var(--green-2);border-radius:3px}
.wrow .chev svg{width:16px;height:16px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
.bar .t{width:34px;font-weight:600}
.bar .track{flex:1;height:9px;background:#eef0ef;border-radius:5px;overflow:hidden}
.bar .fill{height:100%;border-radius:5px}
.bar .n{width:22px;text-align:right;font-weight:600}
.chart svg{width:100%;height:auto;stroke-width:1}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 90px);transform:translateX(-50%);background:#1b1f1d;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.list-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.list-item:first-of-type{border-top:0}
</style>
</head>
<body>
<div id="app">
  <main id="main"></main>
  <nav id="tabbar"></nav>
</div>
<div id="overlay"></div>
<div id="toast"></div>

<script>
'use strict';
/* ---------- ikony ---------- */
const I = {
  home:'<svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  route:'<svg viewBox="0 0 24 24"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>',

  map:'<svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>',

  gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  camera:'<svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>',
  flame:'<svg viewBox="0 0 24 24"><path d="M12 22c4 0 7-3 7-7 0-5-5-7-5-12-3 2-5 5-5 8-1-1-2-2-2-3-1 2-2 4-2 7 0 4 3 7 7 7z"/></svg>',
  bolt:'<svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',
  star:'<svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>',
  retry:'<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  zone:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>',
  sum:'<svg viewBox="0 0 24 24"><path d="M18 4H6l6 8-6 8h12"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  heart:'<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg>',
  mount:'<svg viewBox="0 0 24 24"><path d="M3 20 10 8l4 6 2-3 5 9z"/></svg>',
  diamond:'<svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20"/></svg>',
  pin:'<svg viewBox="0 0 24 24"><path d="M12 22s7-7 7-12a7 7 0 0 0-14 0c0 5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  download:'<svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>',
  upload:'<svg viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5M4 3h16"/></svg>',
};

/* ---------- stałe ---------- */
const GRADES = ['1','2','3','4','5','6','7','8','9'];
const GRADE_COLORS = ['#f5b82e','#f08a24','#22a06b','#1e88e5','#f0587a','#d6409f','#e5484d','#8e4ec6','#1b1f1d'];
const OLD_GRADE = [['4','1'],['5A','2'],['5B','3'],['5C','4'],['6A','5'],['6B','6'],['6C','7'],['7','8'],['8','9']];
const ZEBRA = 'repeating-linear-gradient(45deg,#111 0 3px,#fff 3px 6px)';
const HOLD_COLORS = ['#f5c400','#1e88e5','#22a06b','#e5484d','#8e4ec6','#6b7280','#f08a24','#f0587a','#111111','#ffffff','#b7834f','#7fd8c3','#ff7f6b','#7cc7f0','#1f3a93','#b5e61d',ZEBRA];
const STATUSES = {
  flash:{label:'Flash',cls:'st-flash',icon:I.bolt,bg:'#fde8d7',fg:'#c25f0c'},
  top:{label:'Top',cls:'st-top',icon:I.check,bg:'#e6f2ec',fg:'#1d5c45'},

const RANK = { test:0, nope:1, zona:2, top:3, flash:4 };

const DEFAULT_WALLS = [

  { name:'Groto', sectors:['Duży sześciokąt','Mały sześciokąt','Prawe zacięcie','Beczka','Piony','Kaskady','Diament','Wu','Połóg','Tył wieży','Groto'] },

];
const OLD_DEFAULT_WALLS = ['Boulderownia Wrocław','Boulderowania Wrocław','Strefa Wspinaczkowa','Srefa Wspinaczkowa','Skarpa Bytom'];
function normalizeWall(w){
  const b = w.base || {};
  return { id:w.id, name:String(w.name), city:String(w.city || ''),
    base:Object.fromEntries(BASE_KEYS.map(([k]) => [k, Math.max(0, parseInt(b[k]) || 0)])),

}
const routeDates = r => [r.date, ...r.history.map(h => h.date)];
const doneDate = r => r.doneDate || r.date;
// data, pod którą droga liczy się w statystykach okresu
const statDate = r => DONE(r.status) ? doneDate(r) : routeDates(r).sort().pop();
const statusOn = (r, d) => { const h = r.history.filter(x => x.date === d).pop(); return h ? h.status : r.status; };
function wallTotals(w){
  const rs = D.routes.filter(r => r.wallId === w.id);
  const dates = [...new Set([...rs.flatMap(routeDates), ...D.visits.filter(v => v.wallId === w.id).map(v => v.date)])].sort().reverse();
  const doneG = g => rs.filter(r => DONE(r.status) && r.grade === g).length;
  return { visits:w.base.visits + dates.length, fives:w.base.fives + doneG('5'), sixes:w.base.sixes + doneG('6'),
    comps:w.base.comps, dates, rs };
}
const MONTH_KEYS = [['visits','Wizyty'],['fives','Piąteczki'],['sixes','Szósteczki'],['newWalls','Nowe ścianki'],['comps','Zawody']];
function normalizeMonths(m){
  const out = {};
  Object.entries(m && typeof m === 'object' ? m : {}).forEach(([ym, v]) => {
    if(/^\d{4}-\d{2}$/.test(ym) && v) out[ym] = Object.fromEntries(MONTH_KEYS.map(([k]) => [k, Math.max(0, parseInt(v[k]) || 0)]));
  });
  return out;
}
// dane sprzed aplikacji + to, co wynika z zapisanych dróg
function monthTotals(ym){
  const b = D.months[ym] || {};
  const visits = new Set([...D.routes.flatMap(r => routeDates(r).map(d => r.wallId + '|' + d)), ...D.visits.map(v => v.wallId + '|' + v.date)]
    .filter(k => k.split('|')[1].startsWith(ym))).size;
  const doneG = g => D.routes.filter(r => DONE(r.status) && r.grade === g && doneDate(r).startsWith(ym)).length;
  return { visits:(b.visits || 0) + visits, fives:(b.fives || 0) + doneG('5'), sixes:(b.sixes || 0) + doneG('6'),
    newWalls:b.newWalls || 0, comps:b.comps || 0 };
}
// wizyty bez zapisanych dróg
function normalizeVisits(v){
  return (Array.isArray(v) ? v : []).filter(x => x && typeof x.wallId === 'string' && isDate(x.date)).map(x => ({ wallId:x.wallId, date:x.date }));
}
function plRoutes(n){ return pl(n, 'droga', 'drogi', 'dróg'); }
function pl(n, one, few, many){
  if(n === 1) return `1 ${one}`;

const kcell = (icon, color, n, label, extra = '') => `<div ${extra}><span style="color:${color};display:block">${icon}</span><b>${n}</b><span class="muted">${label}</span></div>`;
// rząd 1: statusy, rząd 2: zrobione / do zrobienia / niezrobione

function statusSummary(list){

const fmtFull = iso => { const [y,m,d] = iso.split('-'); return `${d}.${m}.${y}`; };

/* ---------- IndexedDB ---------- */
const DB = {
  db:null,
  open(){
    return new Promise((res, rej) => {
      const r = indexedDB.open('climbing-pwa', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  get(k){
    return new Promise((res, rej) => {
      const r = this.db.transaction('kv').objectStore('kv').get(k);
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  set(k, v){
    return new Promise((res, rej) => {
      const t = this.db.transaction('kv', 'readwrite');
      t.objectStore('kv').put(v, k);
      t.oncomplete = res; t.onerror = () => rej(t.error);
    });
  }
};

/* ---------- stan ---------- */
let D = { walls:[], routes:[], months:{}, visits:[], settings:{ name:'Wspinaczu', homePrompt:'Co dzisiaj wpadło?' } };

async function save(){
  try { await DB.set('data', D); }
  catch(e){ toast('Błąd zapisu – za mało miejsca?'); console.error(e); }
}

async function init(){
  await DB.open();
  const saved = await DB.get('data');
  if(saved){ D = Object.assign(D, saved); D.routes = D.routes.map(normalizeRoute); D.walls = D.walls.map(normalizeWall); D.months = normalizeMonths(D.months); D.visits = normalizeVisits(D.visits); }
  D.settings = Object.assign({ name:'Wspinaczu', homePrompt:'Co dzisiaj wpadło?' }, D.settings || {});
  ensureDefaultWalls();
  await save();
  setupPwa();
  render();
}

const wallName = id => (D.walls.find(w => w.id === id) || {}).name || 'Nieznana ścianka';
const wallOf = id => D.walls.find(w => w.id === id);
function ensureDefaultWalls(){
  D.walls = D.walls.filter(w => !OLD_DEFAULT_WALLS.includes(w.name) || D.routes.some(r => r.wallId === w.id) || D.visits.some(v => v.wallId === w.id));
  DEFAULT_WALLS.forEach(def => {
    let wall = D.walls.find(w => w.name === def.name);
    if(!wall){ wall = normalizeWall({ id:uid(), name:def.name }); D.walls.push(wall); }
    wall.sectors = [...new Set([...def.sectors, ...wall.sectors])];
  });
}

async function addSector(wallId, forForm){
  const n = (prompt('Nazwa miejsca, np. Diament, Dach, 30 stopni') || '').trim().slice(0, 40);
  if(!n) return;
  const w = wallOf(wallId);
  if(!w.sectors.includes(n)) w.sectors.push(n);
  await save();
  if(forForm && F){ F.sector = n; renderForm(); } else render();
}
async function delSector(wallId, i){
  const w = wallOf(wallId), n = w.sectors[i];
  const used = D.routes.filter(r => r.wallId === wallId && r.sector === n).length;
  if(!confirm(used ? `Usunąć miejsce „${n}”? ${plRoutes(used)} straci to miejsce.` : `Usunąć miejsce „${n}”?`)) return;
  w.sectors.splice(i, 1);
  D.routes.forEach(r => { if(r.wallId === wallId && r.sector === n) r.sector = null; });

async function addPhotos(files){

function resizeImage(file, max, q){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

/* MIESIĄC PO MIESIĄCU */
function viewMonthChart(){
  const now = new Date(), curY = now.getFullYear(), m = S.mMetric;
  const years = [...new Set([String(curY), ...Object.keys(D.months).map(k => k.slice(0, 4)),
    ...D.routes.flatMap(routeDates).map(d => d.slice(0, 4))])].sort();
  if(!years.includes(String(S.year))) S.year = curY;
  const lastM = +S.year === curY ? now.getMonth() : 11;
  const data = Array.from({ length:lastM + 1 }, (_, i) => {
    const ym = `${S.year}-${String(i + 1).padStart(2, '0')}`;
    return { ym, i, v:monthTotals(ym)[m] };
  });
  const color = { visits:'#f08a24', fives:'#2f7a5d', sixes:'#8e4ec6', comps:'#3e63dd' }[m];
  const W = 320, H = 180, L = 24, B = 22, T = 14, R = 6, gw = (W - L - R) / 12;
  const top = Math.ceil(Math.max(4, ...data.map(d => d.v)) / 4) * 4;
  const y = n => T + (H - T - B) * (1 - n / top);
  const cx = i => L + i * gw + gw / 2;
  const grid = [0,1,2,3,4].map(k => { const v = top * k / 4; return `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#eceeec"/><text x="${L-5}" y="${y(v)+4}" font-size="9" fill="#7a817d" text-anchor="end" stroke="none">${v}</text>`; }).join('');
  const bars = data.map(d => `<g onclick="openMonth('${d.ym}')" style="cursor:pointer">
    <rect x="${L + d.i * gw}" y="${T}" width="${gw}" height="${H - T - B}" fill="transparent" stroke="none"/>
    <rect x="${cx(d.i) - 7}" y="${y(d.v)}" width="14" height="${y(0) - y(d.v)}" rx="3" fill="${color}" stroke="none"/>
    ${d.v ? `<text x="${cx(d.i)}" y="${y(d.v) - 3}" font-size="9" font-weight="700" fill="#1b1f1d" text-anchor="middle" stroke="none">${d.v}</text>` : ''}</g>`).join('');
  const labels = MONTHS.map((mm, i) => `<text x="${cx(i)}" y="${H-6}" font-size="9" fill="#7a817d" text-anchor="middle" stroke="none">${mm}</text>`).join('');
  return `
  <div class="card chart">
    <div class="row between" style="margin-bottom:10px">
      <h2 style="margin:0">Miesiąc po miesiącu</h2>
      ${years.length > 1 ? `<div class="pills" style="margin:0">${years.map(yv => `<button class="${+S.year===+yv?'on':''}" onclick="S.year=${yv};render()">${yv}</button>`).join('')}</div>` : `<span class="muted">${S.year}</span>`}
    </div>
    <div class="seg">${BASE_KEYS.map(([k,l]) => `<button class="${m===k?'on':''}" onclick="S.mMetric='${k}';render()">${l}</button>`).join('')}</div>
    <svg viewBox="0 0 ${W} ${H}">${grid}${bars}${labels}</svg>
    <p class="muted" style="margin-top:6px;font-size:11px">Razem: <b>${data.reduce((a, d) => a + d.v, 0)}</b>. Dotknij miesiąca, żeby poprawić dane sprzed aplikacji.</p>
  </div>`;
}
function openMonth(ym){ S.monthEdit = ym; renderMonth(); }
function renderMonth(){
  const ym = S.monthEdit, b = D.months[ym] || {};
  $ov.innerHTML = `
  <div class="sheet">
    <div class="sheet-body">
      <div class="row between" style="margin-bottom:10px">
        <button class="iconbtn" onclick="closeMonth()" aria-label="Zamknij">${I.x}</button>
        <b style="font-size:17px">${MONTHS_FULL[+ym.slice(5) - 1]} ${ym.slice(0, 4)}</b>
        <span style="width:36px"></span>
      </div>
      <p class="muted">Dane sprzed aplikacji. Doliczają się do tego, co zapiszesz w aplikacji w tym miesiącu.</p>
      <div class="card" style="margin-top:12px">
        ${MONTH_KEYS.map(([k,l]) => `<div class="row between" style="margin:6px 0"><span>${l}</span>
          <div class="stepper"><button onclick="changeMonth('${k}',-1)" aria-label="mniej">${I.minus}</button><span>${b[k] || 0}</span>
          <button onclick="changeMonth('${k}',1)" aria-label="więcej">${I.plus}</button></div></div>`).join('')}
      </div>
    </div>
    <div class="sheet-foot"><button class="btn btn-primary" onclick="closeMonth()">Gotowe</button></div>
  </div>`;
}
async function changeMonth(key, delta){
  const ym = S.monthEdit;
  D.months[ym] = D.months[ym] || Object.fromEntries(MONTH_KEYS.map(([k]) => [k, 0]));
  D.months[ym][key] = Math.max(0, D.months[ym][key] + delta);
  await save(); renderMonth();
}
function closeMonth(){ S.monthEdit = null; $ov.innerHTML = ''; render(); }

/* STATYSTYKI */
function viewStats(){
  if(S.period !== 'all' && !/^\d{4}-\d{2}$/.test(S.period)) S.period = 'all';
  const inP = D.routes.filter(r => S.period === 'all' || statDate(r).startsWith(S.period));
  const done = inP.filter(r => S.gradeStatus ? r.status === S.gradeStatus : DONE(r.status));
  const curY = String(new Date().getFullYear());
  const years = [...new Set([curY, ...D.routes.map(r => statDate(r).slice(0, 4)), ...Object.keys(D.months).map(ym => ym.slice(0, 4))])].sort();
  if(!years.includes(S.periodYear)) S.periodYear = curY;
  const byGrade = {};
  done.forEach(r => byGrade[r.grade] = (byGrade[r.grade] || 0) + 1);
  const grades = GRADES.filter(g => byGrade[g]);
  const maxG = Math.max(1, ...Object.values(byGrade));

  // progres: zrobione drogi od stycznia bieżącego roku
  const now = new Date(), pts = [];
  for(let i = 0; i <= now.getMonth(); i++){
    const d = new Date(now.getFullYear(), i, 1);
    const n = D.routes.filter(r => { const x = parseDate(doneDate(r)); return DONE(r.status) && x.getFullYear() === d.getFullYear() && x.getMonth() === d.getMonth(); }).length;
    pts.push({ l:MONTHS[d.getMonth()], n });
  }
  const maxP = Math.max(4, ...pts.map(p => p.n));
  const top = Math.ceil(maxP / 4) * 4;
  const W = 320, H = 170, L = 28, B = 22, T = 8, R = 10;
  const x = i => L + i * (W - L - R) / Math.max(1, pts.length - 1), y = n => T + (H - T - B) * (1 - n / top);
  const grid = [0,1,2,3,4].map(k => { const v = top * k / 4; return `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#eceeec"/><text x="${L-6}" y="${y(v)+4}" font-size="10" fill="#7a817d" text-anchor="end" stroke="none">${v}</text>`; }).join('');

  return `
  <div class="page slide">
    <h1>Statystyki</h1>
    <h2 style="margin:0 2px 10px">Drogi zapisane w aplikacji</h2>
    ${years.length > 1 ? `<div class="pills" style="margin:0 0 8px">${years.map(y => `<button class="${S.periodYear===y?'on':''}" onclick="S.periodYear='${y}';S.period='all';render()">${y}</button>`).join('')}</div>` : ''}
    <div class="mgrid">
      <button class="${S.period==='all'?'on':''}" onclick="S.period='all';render()">Wszystko</button>
      ${MONTHS.map((m, i) => { const ym = `${S.periodYear}-${String(i + 1).padStart(2, '0')}`; return `<button class="${S.period===ym?'on':''}" onclick="S.period='${ym}';render()">${m}</button>`; }).join('')}
    </div>
    <div class="card">${routesKpi(inP, false, true)}</div>
    <div class="card">
      <h2>Rozkład poziomów${S.gradeStatus ? ` – ${STATUSES[S.gradeStatus].label}` : ''}</h2>
      ${grades.length ? grades.map(g => `
        <div class="bar"><span class="t">${g}</span><div class="track"><div class="fill" style="width:${byGrade[g]/maxG*100}%;background:${gradeColor(g)}"></div></div><span class="n">${byGrade[g]}</span></div>`).join('')
        : '<div class="empty">Brak zrobionych dróg w tym okresie</div>'}
    </div>
    <div class="card chart">
      <h2>Progres w czasie</h2>
      <svg viewBox="0 0 ${W} ${H}">
        ${grid}
        <polyline points="${pts.map((p,i) => `${x(i)},${y(p.n)}`).join(' ')}" stroke="#2f7a5d" stroke-width="2.5" fill="none"/>
        ${pts.map((p,i) => `<circle cx="${x(i)}" cy="${y(p.n)}" r="4" fill="#2f7a5d" stroke="#fff" stroke-width="1.5"/><text x="${x(i)}" y="${H-5}" font-size="10" fill="#7a817d" text-anchor="middle" stroke="none">${p.l}</text>`).join('')}
      </svg>
    </div>
  </div>`;
}

/* ŚCIANKI */
function viewMap(){
  const m = S.metric;
  const rows = D.walls.map(w => ({ w, t:wallTotals(w) }));
  const sum = k => rows.reduce((a, x) => a + x.t[k], 0);
  const ranked = rows.filter(x => x.t[m]).sort((a, b) => b.t[m] - a.t[m]);
  const max = Math.max(1, ...ranked.map(x => x.t[m]));
  return `
  <div class="page slide">
    <h1>Ścianki</h1>
    ${D.walls.length ? `
    <div class="card"><div class="stats4">${BASE_KEYS.map(([k,l]) => `<div><b>${sum(k)}</b><span class="muted">${l}</span></div>`).join('')}</div></div>
    <div class="card">
      <h2>Gdzie najwięcej?</h2>
      <div class="seg">${BASE_KEYS.map(([k,l]) => `<button class="${m===k?'on':''}" onclick="S.metric='${k}';render()">${l}</button>`).join('')}</div>
      ${ranked.length ? ranked.map(({ w, t }) => `
        <div class="bar" onclick="openWall('${w.id}')" style="cursor:pointer"><span class="t ellipsis" style="width:110px">${esc(w.name)}</span>
          <div class="track" style="height:14px;border-radius:7px"><div class="fill" style="width:${t[m] / max * 100}%;background:var(--green-2)"></div></div>
          <span class="n" style="width:28px">${t[m]}</span></div>`).join('') : '<div class="muted">Brak danych</div>'}
    </div>
    ${viewMonthChart()}
    <h2 style="margin:20px 2px 10px">Wszystkie ścianki</h2>
    <div class="card group">
      ${D.walls.map(w => `<div class="wrow" onclick="openWall('${w.id}')"><b class="grow ellipsis">${esc(w.name)}</b>
        ${w.city ? `<span class="muted">${esc(w.city)}</span>` : ''}<span class="chev">${I.chev}</span></div>`).join('')}
    </div>
    <p class="muted" style="margin:0 2px">Piąteczki i szósteczki to zrobione drogi (flash lub top) na poziomie 5 i 6.</p>`
    : '<div class="empty">Brak ścianek – dodaj je w Profilu</div>'}
  </div>`;
}

/* PROFIL */
function viewProfile(){
  return `
  <div class="page slide">
    <h1>Profil</h1>
    <div class="card">
      <label class="lbl" style="margin-top:0">Imię</label>
      <div class="field"><input value="${esc(D.settings.name)}" onchange="setName(this.value)" placeholder="Twoje imię"></div>
      <label class="lbl">Tekst na ekranie startowym</label>
      <div class="field"><input maxlength="50" value="${esc(D.settings.homePrompt || 'Co dzisiaj wpadło?')}" onchange="setHomePrompt(this.value)" placeholder="Co dzisiaj wpadło?"></div>
    </div>
    <div class="card">
      <h2>Ścianki</h2>
      ${D.walls.map(w => `<div class="list-item">
        <span class="grow"><b>${esc(w.name)}</b><br><span class="muted">${esc(w.city || '')} · ${D.routes.filter(r => r.wallId===w.id).length} dróg</span></span>
        <button class="iconbtn" style="color:var(--red)" onclick="delWall('${w.id}')" aria-label="Usuń">${I.trash}</button>
      </div>`).join('')}
      <div class="row" style="margin-top:12px">
        <div class="field grow"><input id="wName" placeholder="Nazwa ścianki"></div>
        <div class="field" style="width:110px"><input id="wCity" placeholder="Miasto"></div>
      </div>
      <button class="btn btn-outline" style="margin-top:10px" onclick="addWall()">${I.plus} Dodaj ściankę</button>
    </div>
    <div class="card">
      <h2>Dane</h2>
      <button class="btn btn-outline" onclick="exportData()">${I.download} Eksportuj kopię (JSON)</button>
      <label class="btn btn-outline" style="margin-top:10px">${I.upload} Importuj kopię
        <input type="file" accept="application/json,.json" hidden onchange="importData(this.files[0])"></label>
      <p class="muted" style="margin-top:12px">Dane są przechowywane lokalnie na tym urządzeniu. Rób regularnie kopię zapasową.</p>
    </div>
  </div>`;
}
async function setName(v){ D.settings.name = v.trim() || 'Wspinaczu'; await save(); toast('Zapisano'); }
async function setHomePrompt(v){ D.settings.homePrompt = v.trim() || 'Co dzisiaj wpadło?'; await save(); toast('Zapisano'); }
async function addWall(){
  const n = document.getElementById('wName').value.trim();
  const c = document.getElementById('wCity').value.trim();
  if(!n){ toast('Podaj nazwę ścianki'); return; }
  D.walls.push(normalizeWall({ id:uid(), name:n, city:c }));
  await save(); render(); toast('Dodano ściankę');
}
async function delWall(id){
  const n = D.routes.filter(r => r.wallId === id).length;
  if(!confirm(n ? `Usunąć ściankę razem z ${n} drogami?` : 'Usunąć ściankę?')) return;
  D.walls = D.walls.filter(w => w.id !== id);
  D.routes = D.routes.filter(r => r.wallId !== id);
  D.visits = D.visits.filter(v => v.wallId !== id);
  await save(); render();
}
function exportData(){
  const blob = new Blob([JSON.stringify(D)], { type:'application/json' });
  const file = new File([blob], `wspinanie-${today()}.json`, { type:'application/json' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    navigator.share({ files:[file], title:'Kopia danych' }).catch(() => {});
  } else {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
}
async function importData(file){
  if(!file) return;
  try {
    const d = JSON.parse(await file.text());
    if(!Array.isArray(d.walls) || !Array.isArray(d.routes)) throw new Error('format');
    d.routes = d.routes.map(r => r && normalizeRoute(r));
    const okRoute = r => r && typeof r.id === 'string' && STATUSES[r.status] && (r.grade === null || GRADES.includes(r.grade))
      && /^\d{4}-\d{2}-\d{2}$/.test(r.date) && (r.color === null || /^#[0-9a-f]{6}$/i.test(r.color) || HOLD_COLORS.includes(r.color))
      && Array.isArray(r.photos) && r.photos.every(p => typeof p === 'string' && p.startsWith('data:image/'));
    const okWall = w => w && typeof w.id === 'string' && /^[a-z0-9]+$/i.test(w.id) && typeof w.name === 'string';
    if(!d.walls.every(okWall) || !d.routes.every(r => okRoute(r) && /^[a-z0-9]+$/i.test(r.id))) throw new Error('dane');
    if(!confirm('Zastąpić obecne dane danymi z pliku?')) return;
    D = { walls:d.walls.map(normalizeWall), routes:d.routes, months:normalizeMonths(d.months), visits:normalizeVisits(d.visits),
          settings:{ name:String((d.settings || {}).name || D.settings.name), homePrompt:String((d.settings || {}).homePrompt || 'Co dzisiaj wpadło?') } };
    ensureDefaultWalls();
    await save(); render(); toast('Zaimportowano');
  } catch(e){ toast('Nieprawidłowy plik'); }
}

/* ---------- toast ---------- */
let tt;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------- PWA: ikona + manifest generowane w locie ---------- */
function setupPwa(){
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#1d5c45'; g.fillRect(0, 0, 512, 512);
  g.fillStyle = '#fff';
  g.beginPath(); g.moveTo(90, 400); g.lineTo(230, 150); g.lineTo(310, 280); g.lineTo(350, 220); g.lineTo(430, 400); g.closePath(); g.fill();
  [['#f5c400',200,330],['#e5484d',260,240],['#1e88e5',340,330]].forEach(([col,x,y]) => { g.fillStyle = col; g.beginPath(); g.arc(x, y, 18, 0, 7); g.fill(); });
  const icon = c.toDataURL('image/png');
  document.getElementById('appleIcon').href = icon;
  const manifest = {
    name:'Moje drogi – dziennik wspinaczkowy', short_name:'Moje drogi', display:'standalone',
    start_url:location.href.split('#')[0], background_color:'#f4f5f3', theme_color:'#1d5c45',
    icons:[{ src:icon, sizes:'512x512', type:'image/png' }]
  };
  document.getElementById('manifestLink').href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type:'application/manifest+json' }));
}

init().catch(e => { document.body.innerHTML = '<p style="padding:40px">Błąd uruchomienia: ' + esc(e.message || e) + '</p>'; });
</script>
